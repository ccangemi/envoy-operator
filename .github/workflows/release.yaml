# Release: runs when you push a tag v<OPERATOR_VERSION>, for example v0.1.0.
# It runs all checks again and creates a GitHub release with an archive of
# the operators/envoy-operator/<version>/ directory for the community catalog
# pull request. The project publishes no images: the community catalog
# pipeline builds the bundle image.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    name: Release
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Check that the tagged commit is on main
        run: |
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "ERROR: the tag ${GITHUB_REF_NAME} is not on main. Release only from main." >&2
            exit 1
          fi
      - name: Check that the tag matches versions.env
        run: |
          source versions.env
          if [[ "${GITHUB_REF_NAME}" != "v${OPERATOR_VERSION}" ]]; then
            echo "ERROR: tag ${GITHUB_REF_NAME} does not match OPERATOR_VERSION=${OPERATOR_VERSION} in versions.env" >&2
            exit 1
          fi
      - name: Install the pinned tools
        run: make tools
      - name: Install yamllint
        run: pipx install yamllint
      - name: Run all checks
        run: |
          make bundle-check
          make check
      - name: Prepare the community catalog directory
        run: |
          source versions.env
          hack/community-layout.sh build/community
          tar -C build/community -czf "build/envoy-operator-${OPERATOR_VERSION}-community.tar.gz" operators
      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          source versions.env
          gh release create "${GITHUB_REF_NAME}" \
            --title "envoy-operator ${OPERATOR_VERSION}" \
            --notes "Envoy Gateway ${EG_VERSION}, The Agent Router ${AR_VERSION}. OpenShift ${OPENSHIFT_VERSIONS}." \
            --prerelease="$([[ ${CHANNEL} == alpha ]] && echo true || echo false)" \
            "build/envoy-operator-${OPERATOR_VERSION}-community.tar.gz"
