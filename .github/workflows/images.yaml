# Builds the bundle and test catalog images and pushes them to ghcr.io, so
# that you can test a branch on a real OpenShift cluster:
#   CATALOG_IMAGE=ghcr.io/<owner>/envoy-operator-catalog:<tag> hack/e2e/ocp.sh all
# Tags: sha-<short commit>, and the branch name (with "/" replaced by "-").
name: Images

on:
  push:
    branches: [main, "feature/**"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  images:
    name: Bundle and catalog images
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install the pinned tools
        run: make tools
      - name: Compute the image names
        id: names
        env:
          OWNER: ${{ github.repository_owner }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          registry="ghcr.io/${OWNER,,}"
          sha_tag="sha-${GITHUB_SHA::7}"
          branch_tag=$(echo "$REF_NAME" | tr '/' '-' | tr -cd '[:alnum:]._-')
          {
            echo "registry=$registry"
            echo "sha_tag=$sha_tag"
            echo "branch_tag=$branch_tag"
          } >> "$GITHUB_OUTPUT"
      - name: Log in to ghcr.io
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
      - name: Build and push the images
        env:
          REGISTRY: ${{ steps.names.outputs.registry }}
          SHA_TAG: ${{ steps.names.outputs.sha_tag }}
          BRANCH_TAG: ${{ steps.names.outputs.branch_tag }}
        run: |
          bundle="$REGISTRY/envoy-operator-bundle:$SHA_TAG"
          catalog="$REGISTRY/envoy-operator-catalog:$SHA_TAG"
          make bundle-image catalog-image push CONTAINER_TOOL=docker BUNDLE_IMAGE="$bundle" CATALOG_IMAGE="$catalog"
          for image in envoy-operator-bundle envoy-operator-catalog; do
            docker tag "$REGISTRY/$image:$SHA_TAG" "$REGISTRY/$image:$BRANCH_TAG"
            docker push -q "$REGISTRY/$image:$BRANCH_TAG"
          done
          {
            echo "### Images"
            echo ""
            echo "- Bundle: \`$bundle\`"
            echo "- Catalog: \`$catalog\` (also \`$BRANCH_TAG\`)"
            echo ""
            echo "Test on OpenShift:"
            echo ""
            echo "\`\`\`"
            echo "CATALOG_IMAGE=$catalog hack/e2e/ocp.sh all"
            echo "\`\`\`"
          } >> "$GITHUB_STEP_SUMMARY"
