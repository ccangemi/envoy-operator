# End-to-end test on kind: OLM v0, Gateway API v1.4.1 (like OpenShift 4.22),
# install through a catalog, and a chat completion through a Gateway.
name: E2E (kind)

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    name: kind
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install the pinned tools
        run: |
          make tools
          hack/tools.sh kind
      - name: Run the end-to-end test
        env:
          TIMEOUT: "300"
        run: make e2e-kind
