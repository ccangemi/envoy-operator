# Source: gateway-helm/templates/envoy-gateway-service.yaml
apiVersion: v1
kind: Service
metadata:
  name: envoy-gateway
  labels:
    app.kubernetes.io/name: envoy-gateway
    control-plane: envoy-gateway
    app.kubernetes.io/part-of: envoy-operator
spec:
  type: ClusterIP
  selector: {"app.kubernetes.io/name": "envoy-gateway", "control-plane": "envoy-gateway"}
  ports:
    - name: grpc
      port: 18000
      targetPort: 18000
    - name: ratelimit
      port: 18001
      targetPort: 18001
    - name: wasm
      port: 18002
      targetPort: 18002
    - name: metrics
      port: 19001
      targetPort: 19001
