# Base of the ClusterServiceVersion. `operator-sdk generate bundle` adds the
# install strategy, the owned CRDs and the examples. hack/generate-bundle.sh
# then adds the version, the related images and the icon.
apiVersion: operators.coreos.com/v1alpha1
kind: ClusterServiceVersion
metadata:
  name: envoy-gateway-operator.v0.0.0
  namespace: placeholder
  annotations:
    alm-examples: "[]"
    capabilities: Basic Install
    categories: Networking
    description: >-
      Installs Envoy Gateway on OpenShift with its upstream Helm chart, on top
      of the Gateway API that OpenShift provides.
    repository: https://github.com/ccangemi/envoy-operator
    support: Community
    operatorframework.io/suggested-namespace: envoy-gateway-system
    operatorframework.io/initialization-resource: |-
      {"apiVersion": "envoygateway.ccangemi.github.io/v1alpha1", "kind": "EnvoyGateway",
       "metadata": {"name": "envoy-gateway"}, "spec": {}}
    features.operators.openshift.io/disconnected: "true"
    features.operators.openshift.io/fips-compliant: "false"
    features.operators.openshift.io/proxy-aware: "false"
    features.operators.openshift.io/tls-profiles: "false"
    features.operators.openshift.io/token-auth-aws: "false"
    features.operators.openshift.io/token-auth-azure: "false"
    features.operators.openshift.io/token-auth-gcp: "false"
    features.operators.openshift.io/cnf: "false"
    features.operators.openshift.io/cni: "false"
    features.operators.openshift.io/csi: "false"
  labels:
    operatorframework.io/arch.amd64: supported
    operatorframework.io/arch.arm64: supported
    operatorframework.io/os.linux: supported
spec:
  displayName: Envoy Gateway (Community)
  provider:
    name: envoy-gateway-operator community
    url: https://github.com/ccangemi/envoy-operator
  maintainers:
    - name: Amedeo Salvati
      email: asalvati@redhat.com
  maturity: alpha
  minKubeVersion: 1.35.0
  keywords:
    - envoy
    - envoy-gateway
    - gateway-api
    - ingress
    - api-gateway
  links:
    - name: Operator source code
      url: https://github.com/ccangemi/envoy-operator
    - name: Envoy Gateway
      url: https://gateway.envoyproxy.io/
  installModes:
    - type: OwnNamespace
      supported: true
    - type: SingleNamespace
      supported: false
    - type: MultiNamespace
      supported: false
    - type: AllNamespaces
      supported: false
  # The Gateway API comes from OpenShift, not from OLM. OLM refuses to install
  # the operator when the cluster does not serve these APIs. BackendTLSPolicy v1
  # arrives with Gateway API v1.4, which OpenShift 4.22 provides.
  nativeAPIs:
    - group: gateway.networking.k8s.io
      version: v1
      kind: GatewayClass
    - group: gateway.networking.k8s.io
      version: v1
      kind: Gateway
    - group: gateway.networking.k8s.io
      version: v1
      kind: HTTPRoute
    - group: gateway.networking.k8s.io
      version: v1
      kind: BackendTLSPolicy
  customresourcedefinitions:
    owned:
      - name: envoygateways.envoygateway.ccangemi.github.io
        version: v1alpha1
        kind: EnvoyGateway
        displayName: Envoy Gateway
        description: >-
          An installation of the Envoy Gateway controller. The spec holds the
          values of the upstream gateway-helm chart.
  install:
    strategy: deployment
    spec:
      deployments: null
  description: |
    This community operator installs [Envoy Gateway](https://gateway.envoyproxy.io/)
    __CHART_VERSION__ on OpenShift. Envoy Gateway implements the Kubernetes
    Gateway API with Envoy Proxy.

    The operator is a Helm operator: it installs the upstream `gateway-helm`
    chart, unchanged. The spec of the `EnvoyGateway` resource holds the values
    of the chart, so the upstream documentation of the chart applies.

    The operator uses the Gateway API that OpenShift provides. It never
    installs, changes or removes the Gateway API CRDs
    (`gateway.networking.k8s.io`), which belong to the OpenShift Ingress
    Operator.

    ## Before you install

    * OpenShift 4.22 or later. The operator needs Gateway API v1.4
      (`BackendTLSPolicy` v1), which OpenShift 4.22 provides.
    * Create the namespace `envoy-gateway-system`, and install the operator
      there with the "A specific namespace on the cluster" install mode.

    ## Install Envoy Gateway

    Create one `EnvoyGateway` resource, named `envoy-gateway`, in the namespace
    of the operator:

    ```yaml
    apiVersion: envoygateway.ccangemi.github.io/v1alpha1
    kind: EnvoyGateway
    metadata:
      name: envoy-gateway
      namespace: envoy-gateway-system
    spec: {}
    ```

    The operator then installs:

    * the Envoy Gateway controller, in the same namespace;
    * the certificates of the control plane, with the upstream `certgen` job.

    The Envoy Gateway CRDs (`gateway.envoyproxy.io`) come with the operator.
    OLM installs and upgrades them.

    The operator does not create a GatewayClass, a Gateway or any route. You
    create them, for example with a Helm chart or with Argo CD.

    ## Values that the operator sets

    Some values of the chart are fixed, so that the installation works on
    OpenShift: no Gateway API CRDs, no fixed user IDs (the controller runs
    with the `restricted-v2` SCC), no `watch` block, no namespace creation,
    and the images pinned by digest. The topology injector is off by default.
    The operator documentation lists all of them.

    ## OpenShift notes

    Envoy Gateway always runs the Envoy proxy pods with the fixed user ID
    65532, which `restricted-v2` does not allow. Give the service account of
    each Gateway the `nonroot-v2` SCC, with a RoleBinding to the cluster role
    `system:openshift:scc:nonroot-v2`. The operator documentation has an
    example.

    ## The Agent Router

    To use [The Agent Router](https://github.com/theagentrouter/agent-router)
    (formerly Envoy AI Gateway), set the extension manager values of Envoy
    Gateway in the `EnvoyGateway` resource, then install the Agent Router
    operator. The operator documentation has a complete example.

    ## Documentation

    See the [operator repository](https://github.com/ccangemi/envoy-operator)
    for the installation guide, the upgrade notes and the troubleshooting
    guide.

    This is a community project. It is not affiliated with, or endorsed by,
    the Envoy project.
