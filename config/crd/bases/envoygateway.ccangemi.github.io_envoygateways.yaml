---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: envoygateways.envoygateway.ccangemi.github.io
spec:
  group: envoygateway.ccangemi.github.io
  names:
    kind: EnvoyGateway
    listKind: EnvoyGatewayList
    plural: envoygateways
    singular: envoygateway
  scope: Namespaced
  versions:
    - name: v1alpha1
      served: true
      storage: true
      subresources:
        status: {}
      additionalPrinterColumns:
        - name: Deployed
          type: string
          jsonPath: .status.conditions[?(@.type=="Deployed")].status
        - name: Reason
          type: string
          jsonPath: .status.conditions[?(@.type=="Deployed")].reason
        - name: Age
          type: date
          jsonPath: .metadata.creationTimestamp
      schema:
        openAPIV3Schema:
          description: >-
            EnvoyGateway installs the Envoy Gateway controller in the namespace
            of the resource, with the upstream gateway-helm chart. Create one
            EnvoyGateway, named envoy-gateway, in the namespace of the
            operator.
          type: object
          # One release per namespace. The names of the cluster-scoped objects
          # of the chart contain the release name, so a second resource would
          # install a second, conflicting controller.
          x-kubernetes-validations:
            - rule: self.metadata.name == 'envoy-gateway'
              message: the EnvoyGateway resource must be named envoy-gateway
          properties:
            apiVersion:
              description: >-
                APIVersion defines the versioned schema of this representation
                of an object.
              type: string
            kind:
              description: >-
                Kind is a string value representing the REST resource this
                object represents.
              type: string
            metadata:
              type: object
            spec:
              description: >-
                Values of the operator chart. The values of the upstream
                gateway-helm chart go under the key "gateway-helm". Some
                values are set or refused by the operator; see the operator
                documentation.
              type: object
              default: {}
              x-kubernetes-preserve-unknown-fields: true
              properties:
                gateway-helm:
                  description: >-
                    Values of the upstream gateway-helm chart.
                  type: object
                  # Never let the values be empty: with empty values, a Helm
                  # upgrade keeps the values of the previous release instead
                  # of going back to the chart defaults.
                  default: {}
                  x-kubernetes-preserve-unknown-fields: true
            status:
              description: >-
                Status of the Helm release, written by the operator.
              type: object
              x-kubernetes-preserve-unknown-fields: true
