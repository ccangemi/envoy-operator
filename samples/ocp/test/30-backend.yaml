# A small HTTP backend: the Python web server of a Red Hat UBI image. It
# answers HTTP 200 with a directory listing.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: eg-test
spec:
  replicas: 1
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: backend
          image: registry.access.redhat.com/ubi9/python-312-minimal:latest
          command: ["python3", "-m", "http.server", "8080"]
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            tcpSocket:
              port: 8080
          livenessProbe:
            tcpSocket:
              port: 8080
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
---
apiVersion: v1
kind: Service
metadata:
  name: backend
  namespace: eg-test
spec:
  selector:
    app: backend
  ports:
    - name: http
      port: 8080
      targetPort: http
