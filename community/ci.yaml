---
# ci.yaml for operators/envoy-gateway-operator in
# redhat-openshift-ecosystem/community-operators-prod.
# Check the current format in the operator-pipelines documentation before the
# first pull request:
# https://github.com/redhat-openshift-ecosystem/operator-pipelines/tree/main/docs/users
# The operator uses the FBC workflow: catalog-templates/basic.yaml and the
# release-config.yaml of each bundle define the update graph, so updateGraph
# (only for operators without FBC) is not set.
# GitHub user names that can approve changes to this operator.
reviewers:
  - amedeos
  - ccangemi
  - gpillon
fbc:
  enabled: true
  catalog_mapping:
    - template_name: basic.yaml
      catalog_names: ["v4.22"]
      type: olm.template.basic
